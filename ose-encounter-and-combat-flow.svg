<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1931" viewBox="0 0 880 1931">
<defs>
  <filter id="soft" x="-8%" y="-14%" width="116%" height="134%">
    <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#4a3520" flood-opacity="0.09"/>
  </filter>
  <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5"
          orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9d8760"/></marker>
  <marker id="head2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5"
          orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3f5b43"/></marker>
</defs>
<rect width="880" height="1931" fill="#f4ecda"/>
<text x="30" y="60" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6b3a26" font-weight="700" letter-spacing="2.3">OLD-SCHOOL ESSENTIALS  ·  REFEREE SEQUENCE</text>
<text x="30" y="114" font-family="Georgia, serif" font-size="45" fill="#241d14" font-weight="700">Encounter and Combat Flow</text>
<text x="30" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#5a4e3e">The encounter sequence runs once, from first sight to the end of the turn. A fight inside it runs the combat</text>
<text x="30" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="16.5" fill="#5a4e3e">round over and over until the fight ends.</text>
<line x1="30" y1="216" x2="750" y2="216" stroke="#dbcbab" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="254" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6b3a26" font-weight="700" letter-spacing="2.3">PART ONE  ·  ENCOUNTER SEQUENCE</text>
<text x="750" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#9a7228" font-style="italic" text-anchor="end">happens once</text>
<line x1="30" y1="265" x2="750" y2="265" stroke="#dbcbab" stroke-width="1" stroke-linecap="round"/>
<rect x="100" y="288" width="650" height="115" rx="12" fill="#fcf8ee" stroke="#dbcbab" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="320" r="16.5" fill="#6b3a26"/>
<text x="132" y="325" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">1</text>
<text x="164" y="326" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Surprise</text>
<text x="164" y="358" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">The referee rolls for surprise, if applicable.</text>
<text x="164" y="384" font-family="Georgia, serif" font-size="14" fill="#9a7228" font-style="italic">A surprised side rolls no initiative and takes no action.</text>
<rect x="100" y="431" width="650" height="91" rx="12" fill="#fcf8ee" stroke="#dbcbab" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="463" r="16.5" fill="#6b3a26"/>
<text x="132" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">2</text>
<text x="164" y="469" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Encounter distance</text>
<text x="164" y="501" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">The referee determines how far away the monsters are from the PCs.</text>
<rect x="100" y="550" width="650" height="91" rx="12" fill="#fcf8ee" stroke="#dbcbab" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="582" r="16.5" fill="#6b3a26"/>
<text x="132" y="587" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">3</text>
<text x="164" y="588" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Initiative</text>
<text x="164" y="620" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">Any sides that are not surprised roll initiative to determine who acts first.</text>
<rect x="100" y="669" width="650" height="114" rx="12" fill="#fcf8ee" stroke="#dbcbab" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="701" r="16.5" fill="#6b3a26"/>
<text x="132" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">4</text>
<text x="164" y="707" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Actions</text>
<text x="164" y="739" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">Any sides that are not surprised decide how they will respond to the encounter. The</text>
<text x="164" y="762" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">encounter is played out accordingly.</text>
<path d="M 425.0 783 L 425.0 810" fill="none" stroke="#9d8760" stroke-width="2" marker-end="url(#head)"/>
<rect x="210.0" y="813" width="430" height="60" rx="30" fill="#f4ecda" stroke="#9a7228" stroke-width="1.6"/>
<text x="425.0" y="835" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" fill="#9a7228" font-weight="700" text-anchor="middle" letter-spacing="1.9">THE ENCOUNTER IS PLAYED OUT</text>
<text x="425.0" y="858" font-family="Georgia, serif" font-size="16.5" fill="#241d14" font-weight="700" font-style="italic" text-anchor="middle">Do the sides fight?</text>
<text x="30" y="935" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#3f5b43" font-weight="700" letter-spacing="2.3">PART TWO  ·  COMBAT SEQUENCE PER ROUND</text>
<text x="750" y="935" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#3f5b43" font-style="italic" text-anchor="end" opacity="0.9">repeats until the fight ends</text>
<line x1="30" y1="946" x2="399.0" y2="946" stroke="#c3ccb3" stroke-width="1" stroke-linecap="round"/>
<line x1="451.0" y1="946" x2="750" y2="946" stroke="#c3ccb3" stroke-width="1" stroke-linecap="round"/>
<path d="M 425.0 873 L 425.0 966" fill="none" stroke="#9d8760" stroke-width="2" marker-end="url(#head)"/>
<text x="436.0" y="897" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5a4e3e" font-style="italic">Yes</text>
<rect x="100" y="969" width="650" height="91" rx="12" fill="#f2f1e2" stroke="#c3ccb3" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="1001" r="16.5" fill="#3f5b43"/>
<text x="132" y="1006" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">1</text>
<text x="164" y="1007" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Declare spells and melee movement</text>
<text x="164" y="1039" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">Spells and melee movement are declared before initiative is rolled.</text>
<rect x="100" y="1086" width="650" height="91" rx="12" fill="#f2f1e2" stroke="#c3ccb3" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="1118" r="16.5" fill="#3f5b43"/>
<text x="132" y="1123" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">2</text>
<text x="164" y="1124" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Initiative</text>
<text x="164" y="1156" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">Each side rolls 1d6.</text>
<rect x="100" y="1203" width="650" height="220" rx="12" fill="#f2f1e2" stroke="#c3ccb3" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="1235" r="16.5" fill="#3f5b43"/>
<text x="132" y="1240" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">3</text>
<text x="164" y="1241" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Winning side acts</text>
<text x="164" y="1273" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">The side that wins initiative resolves its actions in this order:</text>
<text x="172" y="1304" font-family="Georgia, serif" font-size="14.5" fill="#3f5b43" font-weight="700">a.</text>
<text x="193" y="1304" font-family="Georgia, serif" font-size="14.5" fill="#5a4e3e">Monster morale (optional rule)</text>
<text x="172" y="1329" font-family="Georgia, serif" font-size="14.5" fill="#3f5b43" font-weight="700">b.</text>
<text x="193" y="1329" font-family="Georgia, serif" font-size="14.5" fill="#5a4e3e">Movement</text>
<text x="172" y="1354" font-family="Georgia, serif" font-size="14.5" fill="#3f5b43" font-weight="700">c.</text>
<text x="193" y="1354" font-family="Georgia, serif" font-size="14.5" fill="#5a4e3e">Missile attacks</text>
<text x="172" y="1379" font-family="Georgia, serif" font-size="14.5" fill="#3f5b43" font-weight="700">d.</text>
<text x="193" y="1379" font-family="Georgia, serif" font-size="14.5" fill="#5a4e3e">Spell casting</text>
<text x="172" y="1404" font-family="Georgia, serif" font-size="14.5" fill="#3f5b43" font-weight="700">e.</text>
<text x="193" y="1404" font-family="Georgia, serif" font-size="14.5" fill="#5a4e3e">Melee attacks</text>
<rect x="100" y="1449" width="650" height="91" rx="12" fill="#f2f1e2" stroke="#c3ccb3" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="1481" r="16.5" fill="#3f5b43"/>
<text x="132" y="1486" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">4</text>
<text x="164" y="1487" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Other sides act</text>
<text x="164" y="1519" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">The remaining sides act in initiative order.</text>
<path d="M 425.0 1540 L 425.0 1567" fill="none" stroke="#9d8760" stroke-width="2" marker-end="url(#head)"/>
<rect x="225.0" y="1570" width="400" height="54" rx="27" fill="#f2f1e2" stroke="#3f5b43" stroke-width="1.6"/>
<text x="425.0" y="1603" font-family="Georgia, serif" font-size="16.5" fill="#241d14" font-weight="700" font-style="italic" text-anchor="middle">Is the fight over?</text>
<path d="M 225.0 1597.0 L 84 1597.0 Q 62 1597.0 62 1579.0 L 62 1040 Q 62 1022 84 1022 L 97 1022" fill="none" stroke="#3f5b43" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#head2)" stroke-linecap="round"/>
<text x="82" y="1587.0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#3f5b43" font-style="italic" letter-spacing="0.4">next round</text>
<path d="M 425.0 1624 L 425.0 1671" fill="none" stroke="#9d8760" stroke-width="2" marker-end="url(#head)"/>
<text x="436.0" y="1648" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5a4e3e" font-style="italic">Yes</text>
<rect x="100" y="1674" width="650" height="115" rx="12" fill="#fcf8ee" stroke="#dbcbab" stroke-width="1" filter="url(#soft)"/>
<circle cx="132" cy="1706" r="16.5" fill="#6b3a26"/>
<text x="132" y="1711" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#fcf8ee" font-weight="700" text-anchor="middle">5</text>
<text x="164" y="1712" font-family="Georgia, serif" font-size="20" fill="#241d14" font-weight="700">Conclusion</text>
<text x="164" y="1744" font-family="Georgia, serif" font-size="15" fill="#5a4e3e">One turn has passed.</text>
<text x="164" y="1770" font-family="Georgia, serif" font-size="14" fill="#9a7228" font-style="italic">However many rounds the fight took.</text>
<path d="M 640.0 843.0 L 814 843.0 Q 836 843.0 836 865.0 L 836 1684 Q 836 1706 814 1706 L 747 1706" fill="none" stroke="#9d8760" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#head)" stroke-linecap="round"/>
<text x="654.0" y="834.0" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12.5" fill="#5a4e3e" font-style="italic">No</text>
<line x1="30" y1="1835" x2="750" y2="1835" stroke="#dbcbab" stroke-width="1" stroke-linecap="round"/>
<text x="30" y="1861" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#7d7059">Both sequences are the rulebook's own wording, with none of the campaign's house rules folded in. Surprise,</text>
<text x="30" y="1882" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#7d7059">encounter distance and monster morale are the referee's calls.</text>
</svg>
